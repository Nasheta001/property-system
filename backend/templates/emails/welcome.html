<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Welcome to Property System</title>
  </head>
  <body style="margin:0;padding:0;background-color:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f7;padding:32px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:12px;border:1px solid #e5e7eb;padding:40px;">
            <tr>
              <td>
                <h1 style="margin:0 0 16px;font-size:20px;color:#111827;">Welcome, {{ full_name }}</h1>
                <p style="margin:0 0 16px;font-size:14px;line-height:22px;color:#4b5563;">
                  Your Property System account has been created. You can now sign in and
                  set up your organization, properties and team.
                </p>
                <a href="{{ frontend_url }}/auth/login"
                   style="display:inline-block;margin-top:8px;padding:10px 20px;background-color:#111827;color:#ffffff;text-decoration:none;border-radius:8px;font-size:14px;">
                  Sign in
                </a>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
