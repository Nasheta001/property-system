<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Payment Receipt</title>
  </head>
  <body style="margin:0;padding:0;background-color:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f7;padding:32px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:12px;border:1px solid #e5e7eb;padding:40px;">
            <tr>
              <td>
                <h1 style="margin:0 0 4px;font-size:20px;color:#111827;">Payment received</h1>
                <p style="margin:0 0 24px;font-size:13px;color:#9ca3af;">Receipt {{ receipt_number }}</p>

                <p style="margin:0 0 16px;font-size:14px;line-height:22px;color:#4b5563;">
                  Hi {{ tenant_name }}, {{ organization_name }} has recorded your payment for unit
                  {{ unit_number }}.
                </p>

                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 16px;border-top:1px solid #e5e7eb;border-bottom:1px solid #e5e7eb;">
                  <tr>
                    <td style="padding:12px 0;font-size:13px;color:#6b7280;">Amount</td>
                    <td style="padding:12px 0;font-size:13px;color:#111827;text-align:right;font-weight:600;">{{ currency }} {{ amount }}</td>
                  </tr>
                  <tr>
                    <td style="padding:0 0 12px;font-size:13px;color:#6b7280;">Method</td>
                    <td style="padding:0 0 12px;font-size:13px;color:#111827;text-align:right;">{{ method }}</td>
                  </tr>
                  <tr>
                    <td style="padding:0 0 12px;font-size:13px;color:#6b7280;">Date</td>
                    <td style="padding:0 0 12px;font-size:13px;color:#111827;text-align:right;">{{ payment_date }}</td>
                  </tr>
                </table>

                <p style="margin:0;font-size:12px;color:#9ca3af;">
                  This receipt was generated automatically by Property System.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
