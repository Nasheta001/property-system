<h2 mat-dialog-title>Terminate lease</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="terminate-form">
    <p class="terminate-form__hint">
      The unit will be marked vacant immediately. This cannot be undone.
    </p>
    <mat-form-field appearance="outline">
      <mat-label>Reason</mat-label>
      <textarea matInput formControlName="reason" rows="3" placeholder="e.g. Tenant relocating"></textarea>
      @if (form.controls.reason.hasError('required') && form.controls.reason.touched) {
        <mat-error>A reason is required.</mat-error>
      }
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-flat-button class="terminate-form__submit" (click)="submit()">Terminate lease</button>
</mat-dialog-actions>
